# ogmara-newsbot configuration
#
# Copy this file to config.yaml and edit. Secrets do NOT belong here — the
# wallet key and AI API keys come from the environment (see .env.example), so
# this file stays safe to share when asking for help.

node:
  # The Ogmara L2 node to publish through. Your posting limits are set by this
  # node — rate limits are enforced at the ingress node only.
  url: https://darkw0rld.mine.nu

  # Which network you intend to publish to. Checked against the node's health
  # endpoint at startup; a mismatch aborts before anything is signed.
  #
  # This is an intent declaration, not a binding: signatures adopt whatever
  # network the NODE reports, so without that startup check a wrong value here
  # would silently publish to the other chain rather than being rejected.
  # Testnet and mainnet share wallet keys, so that would be irreversible.
  network: testnet

  # Request timeout in milliseconds.
  timeoutMs: 30000

posting:
  # When true, posts are composed and printed but never published.
  # This is the default on purpose: news posts propagate across the whole mesh
  # and cannot be truly unpublished. Set to false only once you have reviewed
  # real dry-run output and are happy with it.
  dryRun: true

  # Voluntary content rating: general | teen | mature | explicit
  contentRating: general

  # The bot's own posting cadence. Checked at startup against the UNVERIFIED
  # daily ceiling (every wallet starts there), with 80% headroom for retries.
  maxPostsPerHour: 1

  # What the node allows per wallet. Two windows — a post is refused if EITHER
  # is exceeded — and both are tiered by on-chain registration.
  #
  # These mirror [api.rate_limits] in the node's ogmara.toml and are not
  # discoverable over the API, so change them if your node is configured
  # differently. Values below are the l2-node 0.122.0 defaults.
  #
  # Registering the wallet is the single biggest lever on throughput: 6x the
  # daily ceiling. Run `--register` (costs ~4.4 KLV, one time).
  nodeBurstUnverified: 5      # per 10 minutes
  nodeBurstRegistered: 20
  nodeDailyUnverified: 50     # per 24 hours
  nodeDailyRegistered: 300

  # Tag marking posts as bot-authored. Readers of a decentralized feed should
  # be able to tell automated posts apart, so this is on by default. Set to
  # null only if you disclose some other way.
  disclosureTag: bot

  # Tags added to every post, ranked ahead of AI suggestions. The protocol caps
  # a post at 10 tags total.
  alwaysTags: []

  # Append the source article link on feed-derived posts. Strongly recommended:
  # summarise and link rather than republishing someone else's reporting.
  includeSourceLink: true

sources:
  # RSS / Atom feeds. Each scheduled run posts at most ONE item, so your
  # cadence is set by the cron expression, not by how much a feed publishes.
  rss:
    enabled: true

    # Standard 5-field cron. Validated at startup — a typo stops the bot
    # rather than silently never firing.
    #   "0 * * * *"     every hour on the hour
    #   "*/30 * * * *"  every 30 minutes
    #   "0 9,17 * * *"  09:00 and 17:00 daily
    schedule: "0 * * * *"

    # Skip items older than this many days. 0 disables the check.
    # Keeps a first run from posting a week-old story.
    maxAgeDays: 2

    # Per-feed fetch timeout, and a hard cap on response size so one runaway
    # feed cannot exhaust memory on an unattended bot.
    timeoutMs: 20000
    maxBytes: 5242880

    # `publisher` overrides the name taken from the feed's own title, and is
    # what appears in the post's attribution line.
    feeds:
      - url: https://feeds.bbci.co.uk/news/world/rss.xml
        publisher: BBC News
      - url: https://www.theguardian.com/world/rss
        publisher: The Guardian

ai:
  # anthropic | openai | gemini | openai-compatible
  # See docs/AI-PROVIDERS.md. Only the chosen provider's API key is needed.
  provider: anthropic

  # Model identifier — provider-specific.
  #   anthropic         claude-opus-5
  #   openai            gpt-5
  #   gemini            gemini-3-pro
  #   openai-compatible whatever your server serves
  model: claude-opus-5

  # Uses OPENAI_COMPATIBLE_API_KEY, not OPENAI_API_KEY — see .env.example.
  # Required ONLY for provider: openai-compatible. This is what makes local
  # models work — the bot refuses to start without it on that provider.
  #   Ollama     http://localhost:11434/v1
  #   LM Studio  http://localhost:1234/v1
  #   vLLM       http://localhost:8000/v1
  # baseUrl: http://localhost:11434/v1

  # Anthropic only; ignored by other providers. How hard the model thinks.
  # Composing a post from a supplied summary is a short, scoped task, so `low`
  # is the default. Raise to medium/high if posts read shallowly.
  effort: low

  # Output cap. A post is small — this is headroom, not a target.
  maxTokens: 4096

  # The prompt is where your bot gets its voice. Edit prompts/news.md, or point
  # this at your own file.
  promptPath: prompts/news.md

  # Rough body-length target passed to the model as guidance.
  targetContentChars: 600

  # How many tags to ask for. The protocol caps the final list at 10, and the
  # bot's own required tags (disclosureTag, alwaysTags) rank ahead of these.
  maxTags: 5

profile:
  # The bot's on-network identity. Published with `--set-profile`.
  # Omit a field to leave it unchanged.
  # displayName: My News Bot
  # bio: Automated world-news posts. Not a human.
  # avatarCid: Qm...            # IPFS CID of an avatar image

  # Re-publish the profile on every startup. Off by default: an operator who
  # edits their profile elsewhere shouldn't have the bot silently revert it.
  applyOnStart: false

queue:
  # When the node rate-limits a post, the COMPOSED post is parked here and
  # retried later — so a throttled post never costs a second AI call, and an
  # article that scrolls out of the feed meanwhile still gets published.
  path: data/queue.json

  # Give up on a post after this many failed publish attempts.
  maxAttempts: 5

  # Discard queued posts older than this. Stale news is worse than no news.
  maxAgeHours: 24

storage:
  # Record of what has already been posted. Deleting this file makes the bot
  # treat everything as new again, so keep it with your config.
  ledgerPath: data/ledger.json

  # Entries older than this are pruned on save.
  retentionDays: 90
