name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=low

      - name: Build Docker image
        run: docker build -t ogmara-newsbot:ci .

      - name: Smoke-test the image
        # No wallet/API keys in CI — --help needs neither, and running it
        # through the actual ENTRYPOINT still catches a broken COPY, a
        # missing runtime file, or a bad `node dist/index.js` invocation.
        run: docker run --rm ogmara-newsbot:ci --help
